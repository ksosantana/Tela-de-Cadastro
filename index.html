<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cliente Fiel - Cadastro</title>

  <link rel="stylesheet" href="./css/sty.css" />
</head>
<body>

  <main class="pagina">
    <nav class="navegacao">
  
      <button id="menuToggle" class="btn-menu-hamburguer" type="button">
        ☰
      </button>

      <a class="btn-login" href="https://sistema.appclientefiel.com.br/" target="_blank" >
        Login
      </a>
    </nav>

    <div id="menuLateral" class="menu-lateral">
      <a href="https://appclientefiel.com.br/" class="menu-item">
        <span class="menu-icon">🏠</span> Tela Inicial
      </a>

      <a href="#" id="btnSuporte" class="menu-item">
        <span class="menu-icon">💬</span> Suporte
      </a>
    </div>

    <section class="card-formulario">

      <form id="formCadastro">

        <div class="campo">
          <label for="nome">Nome:</label>
          <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Nome" 
            required
          />
        </div>

        <div class="campo">
          <label for="empresa">Empresa:</label>
          <input 
            type="text" 
            id="empresa" 
            name="empresa" 
            placeholder="Empresa" 
            required
          />
        </div>

        <div class="campo">
          <label for="segmento">Segmento/Ramo:</label>
          <input 
            type="text" 
            id="segmento" 
            name="segmento" 
            placeholder="Segmento/Ramo" 
            required
          />
        </div>

        <div class="campo">
          <label for="origem">Como nos encontrou? (opcional)</label>
          <input 
            type="text" 
            id="origem" 
            name="origem" 
            placeholder="Como nos encontrou?"
          />
        </div>

        <button type="submit" class="btn-cadastrar">
          Criar cadastro
        </button>

      </form>

      <div id="mensagemSucesso" class="mensagem-sucesso"> 
       
      </div> 

    </section>

    

  </main>

  <script src="script.js"></script>
</body>
</html>
