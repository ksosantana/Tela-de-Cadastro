<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="./css/imagens/logoclientefiel-min.webp">

  <title>Cliente Fiel - Cadastro</title>

  <link rel="stylesheet" href="./css/sty.css" />
</head>
<body>

  <main class="pagina">

    <nav class="navegacao">
      <a class="btn-voltar" href="https://appclientefiel.com.br/" target="_blank">
        Voltar
      </a>
    </nav>

    <img
      class="selo-clientefiel"
      src="./css/imagens/SeloClientefiel.png"
      alt="Selo Cliente Fiel"
    />

    <section class="card-formulario">

      <form id="formCadastro">

        <div class="campo">
          <label for="nome">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Nome"
            required
          />
        </div>

        <div class="campo">
          <label for="empresa">Empresa:</label>
          <input
            type="text"
            id="empresa"
            name="empresa"
            placeholder="Empresa"
            required
          />
        </div>

        <div class="linha-mobile">

          <div class="campo campo-mobile">
            <label for="whatsApp">WhatsApp:</label>
            <input
              type="text"
              id="whatsApp"
              name="whatsApp"
              placeholder="WhatsApp"
              required
            />
          </div>

          <div class="campo campo-mobile">
            <label for="segmento">Segmento/Ramo:</label>
            <input
              type="text"
              id="segmento"
              name="segmento"
              placeholder="Segmento/Ramo"
              required
            />
          </div>

        </div>

        <div class="campo">
          <label for="origem">Como nos encontrou? (opcional)</label>
          <input
            type="text"
            id="origem"
            name="origem"
            placeholder="Como nos encontrou?"
          />
        </div>

        <button type="submit" class="btn-cadastrar">
          Criar cadastro
        </button>

      </form>

      <div id="mensagemSucesso" class="mensagem-sucesso"></div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
